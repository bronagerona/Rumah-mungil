<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumah Mungil</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4eaf7;--panel:#fff;--ink:#1b2340;--mut:#5d6788;--line:#c9d2e8;--acc:#2f6bff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121830;--panel:#1d2644;--ink:#eaeefc;--mut:#9aa6cc;--line:#2f3a64;--acc:#6f95ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121830;--panel:#1d2644;--ink:#eaeefc;--mut:#9aa6cc;--line:#2f3a64;--acc:#6f95ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:10px 12px 24px}
.top,.info{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.top h1{font-size:20px;margin:0;font-weight:700}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;color:var(--ink);font-family:inherit}
button.chip{cursor:pointer;font-weight:700;color:var(--acc)}
button.chip.off{opacity:.45}
.row{display:flex;gap:6px}
.room{position:relative;container-type:inline-size;aspect-ratio:1/1.1;border-radius:18px;overflow:hidden;background:#a5b6e3;border:1px solid var(--line)}
.wall{position:absolute;inset:0 0 auto 0;height:26%;background:linear-gradient(#bccaef,#a5b6e3)}
.win{position:absolute;left:33%;top:4%;width:34%;height:16%;border-radius:1.5cqw;background:linear-gradient(#8fd0ff,#d7f0ff);border:1.2cqw solid #f4f6ff}
.floor{position:absolute;inset:26% 0 0 0;background:repeating-linear-gradient(90deg,#d9b88a 0 11cqw,#cfae7f 11cqw 11.5cqw)}
.rug{position:absolute;left:26%;top:46%;width:48%;height:22%;border-radius:50%;background:#7d6bd6;opacity:.35}
.ob{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;font-size:10.5cqw;line-height:1;cursor:pointer;font-family:inherit;z-index:2}
.ob span{font-size:3.2cqw;font-weight:700;background:rgba(255,255,255,.88);color:#1b2340;border-radius:99px;padding:0 2cqw;margin-top:.5cqw;white-space:nowrap}
.ob:active{transform:translate(-50%,-50%) scale(.93)}
.ob:focus-visible,.tab:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:10px}
.ob.on{filter:drop-shadow(0 0 2cqw #fff)}
.me{position:absolute;transform:translate(-50%,-50%);width:11cqw;height:11cqw;border-radius:50%;display:grid;place-items:center;font-size:7.5cqw;z-index:5;box-shadow:0 1.2cqw 0 rgba(0,0,0,.16);transition:left var(--d,1s) linear,top var(--d,1s) linear;cursor:pointer}
.me.sel{outline:.9cqw solid #fff}
.me.f::after{content:'🎀';position:absolute;left:-1.5cqw;top:-2cqw;font-size:4.5cqw}
.me.walk .face{animation:hop .28s infinite alternate}
.nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:3.2cqw;font-weight:700;color:#1b2340;background:rgba(255,255,255,.85);border-radius:99px;padding:0 1.6cqw;margin-top:.6cqw}
.pb{position:absolute;left:50%;top:-7cqw;width:4cqw;height:6cqw;transform:translateX(-50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--pb,#3ddc84);animation:fl 1.6s ease-in-out infinite alternate;transition:background .6s}
.bub{position:absolute;left:50%;bottom:118%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#1b2340;font-size:3.4cqw;font-weight:700;padding:.6cqw 2.2cqw;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
.bub.show{opacity:1}
.night{position:absolute;inset:0;background:#0b1240;opacity:0;pointer-events:none;z-index:8;transition:opacity 1s}
@keyframes hop{to{transform:translateY(-1.2cqw)}}
@keyframes fl{to{transform:translateX(-50%) translateY(1.4cqw)}}
@media(prefers-reduced-motion:reduce){.pb,.me .face{animation:none!important}}
.tabs{display:flex;gap:6px;margin:10px 0 6px}
.tab{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer}
.tab.on{border-color:var(--acc);color:var(--ink)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px;margin-bottom:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.needs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px 8px;text-align:center;font-size:13px;color:var(--mut)}
.nd .v{height:46px;width:12px;margin:4px auto 0;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.nd .v i{position:absolute;left:0;right:0;bottom:0;height:50%;transition:height .3s,background .3s}
.evt{position:absolute;left:4%;right:4%;top:2%;z-index:9;background:rgba(255,255,255,.95);color:#1b2340;border-radius:12px;padding:1cqw 3cqw;font-size:3.5cqw;font-weight:700;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
.evt.show{opacity:1}
.pet{position:absolute;left:30%;top:66%;transform:translate(-50%,-50%);font-size:7cqw;line-height:1;z-index:4;cursor:pointer;transition:left 2.5s linear,top 2.5s linear}
.room.gd .wall{background:linear-gradient(#8fd0ff,#c9ecff)}
.room.gd .floor{background:repeating-linear-gradient(90deg,#6dbb5a 0 11cqw,#62ae50 11cqw 11.5cqw)}
.room.gd .win,.room.gd .rug{display:none}
.face{width:100%;height:100%;display:grid;place-items:center;border-radius:50%;background-size:cover;background-position:center}
.emo{position:absolute;right:-3.4cqw;top:-1.8cqw;font-size:3.6cqw;line-height:1;background:rgba(255,255,255,.93);border-radius:50%;padding:.5cqw;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.25);pointer-events:none}
.pet.ci{width:10cqw;height:10cqw;border-radius:50%;font-size:0;background:#cfe8d5;box-shadow:0 1cqw 0 rgba(0,0,0,.16)}
.nbr .nm{white-space:nowrap}
.nbr{position:absolute;left:50%;top:96%;transform:translate(-50%,-50%);font-size:7.5cqw;line-height:1;z-index:4;cursor:pointer;display:none;transition:left 3s linear,top 3s linear}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.shop{display:none;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
.shop.open{display:block}
.shop h2{font-size:16px;margin:0 0 6px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.it small{display:block;color:var(--mut)}
.it button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:3px 12px;background:var(--acc);color:#fff;cursor:pointer;white-space:nowrap}
.it button:disabled{background:var(--line);color:var(--mut);cursor:default}
.foot{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--mut)}
.foot button{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer}
@media (orientation:landscape) and (min-width:560px){
.app{max-width:none;display:grid;grid-template-columns:min(calc((100dvh - 78px)/1.1),52vw) minmax(0,.7fr) minmax(0,1.3fr);column-gap:12px;align-items:start;padding:6px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.app>*{grid-column:2/4;margin-bottom:6px}
.app>.top{grid-column:2}
.app>.info{grid-column:3}
.app>.vw{grid-column:1;grid-row:1}
.app>.room{grid-column:1;grid-row:2/span 40;position:sticky;top:6px;margin:0}
.app>.tabs{grid-column:2;margin:0 0 6px}
.app>.stat{grid-column:3}
.top h1{display:none}
.top{justify-content:flex-end}
.chip{white-space:nowrap}
.info{flex-wrap:wrap;justify-content:flex-end}
.info .row{flex-wrap:wrap;justify-content:flex-end}
.top,.info{margin-bottom:0}
.nd{padding:4px 2px 6px;font-size:12px}
.nd .v{height:24px;margin-top:2px}
.ob span{font-size:max(3.2cqw,9px)}
.nm{font-size:max(3.2cqw,8px)}
.emo{font-size:max(3.6cqw,9px)}
.bub{font-size:max(3.4cqw,9px)}
.evt{font-size:max(3.5cqw,9px)}
}

.night{mix-blend-mode:multiply;transition:opacity 1s,background-color 1s}
.ob{filter:drop-shadow(0 1cqw .8cqw rgba(0,0,0,.22))}
.ob.on{filter:drop-shadow(0 0 2cqw #fff)}
.me::before{content:'';position:absolute;left:8%;right:8%;bottom:-2.6cqw;height:3cqw;border-radius:50%;background:rgba(0,0,0,.2);z-index:-1}
.me.talk,.nbr.talk{z-index:7}
.talk .bub{border:.5cqw solid var(--tc,#2f6bff)}
.bub{bottom:calc(100% + 8cqw);white-space:normal;width:max-content;max-width:34cqw;text-align:center;border-radius:2.4cqw;padding:.9cqw 2.4cqw;font-size:max(3.8cqw,10px);line-height:1.2;box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.25);z-index:3}
.bub::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:1.3cqw solid transparent;border-top-color:#fff}
.nbr .bub{bottom:calc(100% + 1cqw)}
.floor::before{content:'';position:absolute;left:0;right:0;top:0;height:2cqw;background:linear-gradient(#8a6a48,#b99668)}
.floor::after{content:'';position:absolute;left:0;right:0;top:2cqw;height:9cqw;background:linear-gradient(rgba(0,0,0,.16),transparent)}
.room::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 9cqw rgba(0,0,30,.3);z-index:9}
.win::before{content:'';position:absolute;inset:-1.2cqw -3.2cqw;border-left:3.2cqw solid #e8a0b4;border-right:3.2cqw solid #e8a0b4;border-radius:1cqw;pointer-events:none}
.win::after{content:'☀️';position:absolute;right:18%;top:10%;font-size:6cqw;line-height:1}
.room[data-p=night] .win{background:linear-gradient(#0e1440,#2a3470)}
.room[data-p=night] .win::after{content:'🌙'}
.room[data-p=dusk] .win{background:linear-gradient(#ff9a6a,#ffd9a0)}
.room[data-p=dawn] .win{background:linear-gradient(#ffc2d9,#ffe9c7)}
.fx{position:absolute;font-size:5cqw;line-height:1;pointer-events:none;z-index:9;transform:translate(-50%,-50%);animation:rise 1.4s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-260%)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.talk .face{animation:wig .5s ease-in-out 3}
#chat{font-size:13px;line-height:1.4;min-height:78px}
#chat div{overflow-wrap:anywhere}
.stat,.nd,.chip,.tab,.shop{box-shadow:0 1px 3px rgba(20,30,70,.1)}
.bar i{background:linear-gradient(90deg,#2f6bff,#6fa0ff)}
@media (orientation:landscape) and (min-width:560px){.app>#chat{grid-column:2/4;min-height:0}.app>#bal{grid-column:2/4}}
@media(prefers-reduced-motion:reduce){.fx{display:none}.talk .face{animation:none}}
.go{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(10,14,40,.88);padding:20px}
.go>div{background:var(--panel);color:var(--ink);border-radius:18px;padding:22px;max-width:360px;text-align:center}
.go h2{margin:0 0 8px}
.go button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:8px 20px;background:var(--acc);color:#fff;margin-top:12px;cursor:pointer}
.vw .tab{font-size:12px;padding:4px 2px;white-space:nowrap;overflow:hidden}
.room[data-l="2"] .wall{background:linear-gradient(#cfd8ea,#b8c4de)}
.room[data-l="2"] .floor{background:repeating-linear-gradient(90deg,#8f9bb3 0 10cqw,#8793ab 10cqw 10.4cqw)}
.room[data-l="3"] .wall{background:linear-gradient(#3a4256,#2c3344)}
.room[data-l="3"] .floor{background:repeating-linear-gradient(0deg,#4d5362 0 8cqw,#454b59 8cqw 8.4cqw)}
.room[data-l="4"] .wall{background:linear-gradient(#f3dcc4,#e8c7a6)}
.room[data-l="4"] .floor{background:repeating-conic-gradient(#efe6d6 0 25%,#c7bba3 0 50%) 0 0/12cqw 12cqw}
.room:not([data-l="0"]) .rug{display:none}
.vw .tab .tn{display:none}
.vw .tab.on{flex:2.4}.vw .tab.on .tn{display:inline}
@media (orientation:portrait){.vw .tab .tn{display:inline}.vw .tab.on{flex:1}.vw .tab{font-size:11.5px;padding:4px 1px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Rumah Mungil</h1>
    <div class="row">
      <button class="chip" id="bm" aria-label="Musik">🎵</button>
      <button class="chip" id="bs" aria-label="Efek suara">🔊</button>
      <button class="chip" id="spd" aria-label="Kecepatan">1x</button>
    </div>
  </div>
  <div class="info">
    <span class="chip" id="clock">Hari 1 · 07:00</span>
    <span class="row"><span class="chip" id="money">Rp 100rb</span><button class="chip" id="bshop">🛍️ Toko</button></span>
  </div>
  <div class="vw" style="display:flex;gap:6px;margin-bottom:8px"><button class="tab vb on" id="vb0">🏠<span class="tn"> Rumah</span></button><button class="tab vb" id="vb1" style="display:none">🌳<span class="tn"> Taman</span></button><button class="tab vb" id="vb2">🏢<span class="tn"> Kantor</span></button><button class="tab vb" id="vb3">🏋️<span class="tn"> Gym</span></button><button class="tab vb" id="vb4">☕<span class="tn"> Kafe</span></button></div>
  <div class="room" id="room">
    <div class="wall"></div><div class="win"></div><div class="floor"></div><div class="rug"></div>
    <div class="night" id="night"></div><div class="evt" id="evt"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stat"><span id="act">Santai</span><div class="bar"><i id="prog"></i></div><div id="rel" style="font-size:13px;color:var(--mut);margin-top:6px"></div></div>
  <div class="stat" id="bal"></div>
  <div class="stat" id="longProgress"></div>
  <div class="stat" id="chat"></div>
  <div class="acts"><button class="chip" id="ba">Auto</button><button class="chip" id="bg">💬 Sapa</button><button class="chip" id="bh">🎁 Hadiah Rp10rb</button><button class="chip" id="bt">🛋️ Ajak ngobrol</button><button class="chip" id="bk">💞 Kencan Rp40rb</button><button class="chip" id="bn">👥 Tetangga</button></div>
  <div class="acts"><button class="chip" id="bp">📷 Ganti gambar</button></div>
  <div class="acts" id="pp" style="display:none"></div>
  <input type="file" accept="image/*" id="pf" hidden>
  <div class="go" id="go"><div><h2>💔 Keluarga bubar</h2><p id="gom"></p><button id="gob">Mulai dari awal</button></div></div>
  <div class="needs" id="needs"></div>
  <div class="shop" id="shop"></div>
  <div class="shop" id="nbp"></div>
  <div class="foot"><span>Pilih karakter, lalu ketuk benda.</span><button id="dif">Tingkat</button><button id="reset">Ulang</button></div>
</div>
<script>
const $=s=>document.querySelector(s);
const NAMA={lapar:'Lapar',energi:'Energi',bersih:'Bersih',hibur:'Hibur',sosial:'Sosial'};
const DECAY={lapar:.08,energi:.06,bersih:.05,hibur:.07,sosial:.04};
const OB={
  kulkas:{x:14,y:33,e:'🧊',l:'Kulkas',n:'Makan',m:30,fx:{lapar:2},cost:15,say:'Nyam nyam!'},
  komputer:{r:2,hr:[8,17],x:32,y:44,e:'💻',l:'Kerja',n:'Kerja di kantor',m:240,fx:{energi:-.08,hibur:-.05},pay:1,say:'Gaji masuk!'},

  lukis:{x:31,y:51,e:'🎨',l:'Lukis',n:'Melukis',m:90,fx:{hibur:.5,energi:-.04},pay:.2,buy:1,say:'Lukisan laku terjual!'},
  gym:{r:3,hr:[6,22],x:50,y:46,e:'🏋️',l:'Beban',n:'Angkat beban',m:45,cost:8,gymfee:1,fx:{hibur:.5,sosial:.1,bersih:-.5,lapar:-.4,energi:-.1},say:'Badan jadi segar!'},
  kebun:{r:1,need:'taman',x:22,y:44,e:'🌻',l:'Kebun',n:'Berkebun',m:60,fx:{hibur:.45,bersih:-.25},pay:.15,say:'Panen sayur!'},
  bbq:{r:1,need:'taman',x:74,y:44,e:'🍖',l:'BBQ',n:'Panggang BBQ',m:40,fx:{lapar:2.2,sosial:.5,hibur:.2},cost:10,say:'Enak banget!'},
  bangku:{r:1,need:'taman',x:48,y:72,e:'🪑',l:'Bangku',n:'Duduk santai',m:45,fx:{hibur:.4,sosial:.5,energi:.04},say:'Udara segar.'},
  ngobrol:{x:50,y:62,e:'💬',l:'Ngobrol',n:'Ngobrol dengan tamu',m:25,fx:{sosial:1.4},here:1,hid:1,say:''},
  pantry:{r:2,hr:[8,17],x:72,y:44,e:'☕',l:'Pantry',n:'Ngopi di pantry',m:20,fx:{hibur:.5,sosial:.5,energi:.06},cost:5,say:'Segar lagi!'},
  treadmill:{r:3,hr:[6,22],x:24,y:44,e:'🏃',l:'Treadmill',n:'Lari di treadmill',m:40,fx:{hibur:.5,bersih:-.4,lapar:-.4,energi:-.1},cost:8,gymfee:1,say:'Keringat bercucuran!'},
  yoga:{r:3,hr:[6,22],x:76,y:68,e:'🧘',l:'Yoga',n:'Yoga',m:40,fx:{hibur:.4,energi:.05,sosial:.1},cost:8,gymfee:1,say:'Tenang dan segar.'},
  meja:{r:4,hr:[7,22],x:28,y:46,e:'🍰',l:'Meja',n:'Makan di kafe',m:40,fx:{lapar:3,hibur:.3,sosial:.3},cost:25,say:'Enak sekali!'},
  kopi:{r:4,hr:[7,22],x:72,y:46,e:'☕',l:'Kopi',n:'Ngopi santai',m:25,fx:{energi:.25,hibur:.4,sosial:.5},cost:12,say:'Kopinya mantap.'},
  musik:{r:4,hr:[7,22],x:50,y:70,e:'🎵',l:'Live music',n:'Nonton live music',m:45,fx:{hibur:.8,sosial:.4},cost:10,say:'Lagunya enak!'}
};
const UP={
  kasur:['Kasur empuk','Energi tidur +50% per tingkat',150,.5],
  tv:['TV layar lebar','Hiburan TV +50% per tingkat',200,.5],
  kulkas:['Kulkas besar','Makan makin murah tiap tingkat',120,0],
  komputer:['Komputer baru','Gaji kerja +50% per tingkat',250,0],
  shower:['Pemanas air','Mandi +40% per tingkat',100,.4],
  buku:['Rak buku','Buka kegiatan Baca; karier naik 50% lebih cepat',180,0,1],
  lukis:['Easel lukis','Buka kegiatan Melukis; lukisan bisa dijual',160,0,1],
  gym:['Member gym','Gratis tiap latihan di gym; energi lebih awet',220,0,1],
  taman:['Taman belakang','Ruang baru: kebun, BBQ, dan bangku',300,0,1],

  else if(wkHi)gameOver('Terlalu fokus bekerja. Sari merasa diabaikan dan keluarga pun bubar.');
  else{S.money=Math.max(0,S.money-40);S.tk=50;S.wk=Math.min(100,S.wk+10);evt('⚠️ Kariermu mandek, gaji dipotong Rp40rb. Jaga pekerjaanmu!');sfx('no')}}
function balTick(dt){const d=.008*dt*df().d*lvF();
  S.wk=Math.max(0,S.wk-d);S.fm=Math.max(0,S.fm-d);
  const gap=Math.abs(S.wk-S.fm),T=TOL();
  if(gap>T)S.tk=Math.min(100,S.tk+(gap-T)*.004*dt*df().d/(1+.1*(S.lv-1)));else S.tk=Math.max(0,S.tk-.03*dt);
  if(S.fm<20&&S.t-(S.fw===undefined?-999:S.fw)>360){S.fw=S.t;evt('⚠️ Keluarga mulai renggang! Luangkan waktu untuk Sari dan Kiki.')}
  if(S.fm<=0){S.bb=(S.bb||0)+dt;if(S.bb>=240){gameOver('Hubungan keluarga habis terlalu lama. Sari dan Kiki memutuskan pergi.');return}}else S.bb=0;
  if(S.tk>=100)tekan()}
function balDay(){const ok=Math.abs(S.wk-S.fm)<=TOL()&&S.wk>=35&&S.fm>=35;
  if(ok){S.xp++;if(S.xp>=XPN()&&S.lv<10){S.lv++;S.xp=0;S.tk=0;const r=30*S.lv;S.money+=r;sfx('up');return '⭐ Naik ke Level '+S.lv+'! Bonus Rp '+r+'rb.'}}
  return ''}
function balRender(){if(S.over)showOver();
  const key=[S.lv,S.xp,Math.round(S.wk),Math.round(S.fm),Math.round(S.tk)].join();if(key===balKey)return;balKey=key;
  const T=TOL(),gap=S.wk-S.fm,okb=Math.abs(gap)<=T,st=okb?'Seimbang ✓':gap>0?'Condong ke kerja':'Condong ke keluarga';
  const bar=(l,v,c)=>'<div style="display:flex;align-items:center;gap:6px;margin-top:4px"><span style="width:96px">'+l+'</span><div class="bar" style="flex:1;margin:0"><i style="width:'+v+'%;background:'+c+'"></i></div><span style="width:26px;text-align:right">'+Math.round(v)+'</span></div>';
  $('#bal').innerHTML='<b>⭐ Level '+S.lv+'</b> <span style="color:var(--mut)">· XP '+S.xp+'/'+XPN()+' · toleransi ±'+T+'</span><span style="float:right;font-weight:700;color:'+(okb?'#2f9e6b':'#e5484d')+'">'+st+'</span>'+bar('💼 Karier',S.wk,'#2f6bff')+bar('👨‍👩‍👦 Keluarga',S.fm,'#e0559a')+bar('⚖️ Tekanan',S.tk,S.tk>66?'#e5484d':S.tk>33?'#f0a020':'#2f9e6b')}
function resetGame(){const dif=S.dif;R.forEach(r=>{clearTimeout(r.to);r.cur=null;r.idle=0;r.el.classList.remove('walk');r.el.querySelector('.bub').classList.remove('show')});
  S=START();S.dif=dif;try{localStorage.removeItem('rumahmungil2')}catch(e){}
  S.ch.forEach((c,i)=>place(i,c.x,c.y,0));$('#pet').style.left='30%';$('#pet').style.top='66%';
  CL.length=0;renderChat();chatBusy=0;balKey='';$('#go').style.display='none';setView(0);pick(0);if($('#shop').classList.contains('open'))shop();render()}
$('#gob').onclick=resetGame;
const LOCN=['Rumah','Taman','Kantor','Gym','Kafe'],LOCHR={2:[8,17],3:[6,22],4:[7,22]};
const pad2=n=>String(n).padStart(2,'0');
function openNow(k){const o=OB[k];if(!o.hr)return true;const hr=(S.t%1440)/60;return hr>=o.hr[0]&&hr+o.m/60<=o.hr[1]}
const AREA=r=>r===1?0:r,TM={'0-2':25,'0-3':15,'0-4':10,'2-3':20,'2-4':12,'3-4':8};
const tmin=(a,b)=>{a=AREA(a);b=AREA(b);return a===b?0:TM[Math.min(a,b)+'-'+Math.max(a,b)]};
const fare=()=>Math.max(2,Math.round(4*df().b));
const LB=[{n:'Pak Rudi',e:'👔',loc:2,x:62,y:68,L:['Laporanmu bagus!','Targetnya jangan lupa ya','Kerja bagus minggu ini']},
  {n:'Mita',e:'👩‍💼',loc:2,x:16,y:70,L:['Mau kopi?','Hari ini sibuk ya','Semangat ya!']},
  {n:'Coach Jaya',e:'🧑‍🏫',loc:3,x:52,y:70,L:['Atur napasnya!','Jangan lupa pemanasan','Satu set lagi!']},
  {n:'Lila',e:'🧑‍🍳',loc:4,x:50,y:32,L:['Pesan apa hari ini?','Kue barunya enak lho','Selamat menikmati!']}];
const LBE=LB.map((b,i)=>{const e=document.createElement('div');e.className='nbr';e.style.left=b.x+'%';e.style.top=b.y+'%';
  e.innerHTML=b.e+'<div class="bub"></div><div class="nm">'+b.n+'</div>';e.onclick=()=>lbAct(i);room.insertBefore(e,night);return e});
const LBT={};
function lbAct(i){const b=LB[i],c=S.ch[sel];if((c.rm|0)!==b.loc){say(sel,'Terlalu jauh untuk ngobrol',1600);return}
  sfx('tap');if(S.t-(LBT[i]===undefined?-999:LBT[i])<60){say(sel,b.n+' sedang sibuk',1500);return}
  LBT[i]=S.t;c.n.sosial=Math.min(100,c.n.sosial+15);c.n.hibur=Math.min(100,c.n.hibur+5);
  if(b.loc===2)S.wk=Math.min(100,S.wk+1.5);
  const t=pk(b.L),bb=LBE[i].querySelector('.bub');bb.textContent=t;bb.classList.add('show');setTimeout(()=>bb.classList.remove('show'),2600);
  say(sel,'Ngobrol dengan '+b.n+' 💬',2200);logLine(b.n,'#7a6fd0',t);fxp(LBE[i],'💬');sfx('coin')}
function locTick(dt){
  [0,1].forEach(i=>{const t=R[i].trip;if(!t)return;t.left-=dt;
    if(t.left<=0){R[i].trip=null;S.ch[i].rm=t.dest;place(i,50,96,0);R[i].el.classList.remove('walk');if(i===sel)setView(t.dest);else vis();go(i,t.k)}});
  const hr=(S.t%1440)/60;
  LBE.forEach((e,i)=>{const b=LB[i],h=LOCHR[b.loc];e.style.display=view===b.loc&&hr>=h[0]&&hr<h[1]?'block':'none'})}
function locClose(h){[0,1].forEach(i=>{const rm=S.ch[i].rm|0;
  if(rm>=2&&!R[i].cur&&(h>=LOCHR[rm][1]||h<LOCHR[rm][0])){say(i,'Sudah tutup, pulang dulu\u2026',2200);go(i,'sofa')}})}
[2,3,4].forEach(v=>{$('#vb'+v).onclick=()=>{sfx('tap');setView(v)}});
const pk=a=>a[Math.floor(Math.random()*a.length)];
const price=k=>Math.round(UP[k][2]*[1,2.2,4][S.up[k]|0]);
function evt(m){const e=$('#evt');e.textContent=m;e.classList.add('show');clearTimeout(evt.t);evt.t=setTimeout(()=>e.classList.remove('show'),4500)}
function newDay(dn){S.day=dn;const bm=balDay();S.nb.rel=S.nb.rel.map((r,i)=>S.nb.v.some(x=>x.i===i)?r:Math.max(0,r-2));const lv=Object.values(S.up).reduce((a,b)=>a+(b|0),0),bill=Math.round((10+2*lv+(S.kid?8:0))*df().b);let m='';
  if(S.money>=bill){S.money-=bill;m='Tagihan −Rp '+bill+'rb. '}else{S.money=0;S.ch.forEach(c=>c.n.hibur=Math.max(0,c.n.hibur-15));m='Tagihan menunggak, stres! '}
  const E=[['Bonus dari klien +Rp 40rb',()=>{S.money+=40}],['Tetangga mampir, sosial naik!',()=>S.ch.forEach(c=>c.n.sosial=Math.min(100,c.n.sosial+25))],['Listrik padam, hiburan turun.',()=>S.ch.forEach(c=>c.n.hibur=Math.max(0,c.n.hibur-12))],['Dapat kue gratis, perut kenyang!',()=>S.ch.forEach(c=>c.n.lapar=Math.min(100,c.n.lapar+30))],['Hujan deras, rumah terasa nyaman.',()=>S.ch.forEach(c=>c.n.energi=Math.min(100,c.n.energi+10))],
    ['Atap bocor, biaya perbaikan −Rp 30rb',()=>{S.money=Math.max(0,S.money-30)}],
    ['Barang elektronik rusak −Rp 20rb',()=>{S.money=Math.max(0,S.money-20)}],
    ['Flu menyerang, energi turun.',()=>S.ch.forEach(c=>c.n.energi=Math.max(0,c.n.energi-25))],
    ['Cuaca panas, jadi cepat kotor.',()=>S.ch.forEach(c=>c.n.bersih=Math.max(0,c.n.bersih-25))]];
  if(Math.random()<.7){const e=pk(E);e[1]();m+=e[0]}
  if(S.rel>=100&&!S.kid){S.kid={age:0,lapar:80,energi:80,hibur:80,sleep:0};kid.style.left='38%';kid.style.top='62%';m+=' Bayi Kiki lahir! 👶'}
  evt(m+(bm?' '+bm:''));sfx('tap');if($('#shop').classList.contains('open'))shop()}
$('#bk').onclick=()=>{if(S.rel<25){sfx('no');say(sel,'Belum cukup dekat…',1800);return}
  if(S.money<40){sfx('no');say(sel,'Uang tidak cukup',1500);return}
  S.money-=40;famUp(8);S.rel=Math.min(100,S.rel+10);S.ch.forEach((c,i)=>{c.n.hibur=Math.min(100,c.n.hibur+25);c.n.sosial=Math.min(100,c.n.sosial+30);say(i,'Kencan seru! 💞',2600)});sfx('up')};
function auto(i){const c=S.ch[i],n=c.n,hr=(S.t%1440)/60,k=Object.keys(n).sort((a,b)=>n[a]-n[b])[0];
  const M={lapar:'kulkas',energi:'kasur',bersih:'shower',hibur:'tv',sosial:'sofa'};let t;
  if(n[k]<40)t=M[k];
  else if((hr>=22||hr<5)&&n.energi<85)t='kasur';
  else if(S.money<60)t='komputer';
  else t=pk(['komputer','sofa','tv','telepon','komputer'].concat(['buku','lukis','gym','kebun','bangku'].filter(x=>S.up[OB[x].need||x])));
  if(t==='kulkas'&&S.money<cost('kulkas'))t='komputer';
  if(t==='komputer'&&n.energi<30)t='kasur';
  if(!openNow(t))t=(hr>=22||hr<5)?'kasur':'sofa';R[i].idle=0;go(i,t)}
function mood(c){const v=Object.values(c.n);return v.reduce((a,b)=>a+b,0)/v.length}
$('#ba').onclick=()=>{sfx('tap');say(sel,sel===0?'Budi tetap kamu yang mengendalikan.':(window.__sariAIReady?'Sari dikendalikan AI cloud.':'AI Sari belum siap.'),2200)};
$('#bg').onclick=()=>{const c=S.ch[sel],m=mood(c);sfx('tap');famUp(.8,'sapa');
  if(m>60){c.n.sosial=Math.min(100,c.n.sosial+12);say(sel,pk(['Hai! 😊','Halo juga~','Senang disapa!']),2200)}
  else if(m>35)say(sel,pk(['Hmm, iya?','Hai…']),2000);
  else say(sel,pk(['Nanti dulu ya…','Lagi capek…','Aku butuh sesuatu dulu…']),2200)};
$('#bh').onclick=()=>{if(S.money<10){sfx('no');say(sel,'Uang tidak cukup',1500);return}
  const c=S.ch[sel];S.money-=10;c.n.hibur=Math.min(100,c.n.hibur+25);c.n.sosial=Math.min(100,c.n.sosial+8);S.rel=Math.min(100,S.rel+3);famUp(2,'hadiah');sfx('coin');say(sel,pk(['Wah, makasih! 🎁','Hadiah buat aku?','Baik banget~']),2400)};
$('#bt').onclick=()=>{famUp(3,'ajak');window.__sariPendingRequest='Budi mengajak Sari ngobrol di sofa';say(0,'Aku mengajak Sari ngobrol.',1800)};
$('#spd').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('#spd').textContent=speed+'x';sfx('tap')};
let rq=0,rq2=0;
$('#reset').onclick=()=>{const b=$('#reset');
  if(!rq){rq=1;b.textContent='Yakin? Ketuk lagi';b.style.color='#e5484d';clearTimeout(rq2);rq2=setTimeout(()=>{rq=0;b.textContent='Ulang';b.style.color=''},3500);return}
  clearTimeout(rq2);rq=0;b.textContent='Ulang';b.style.color='';
  const dif=S.dif;
  R.forEach(r=>{clearTimeout(r.to);r.cur=null;r.idle=0;r.el.classList.remove('walk');r.el.querySelector('.bub').classList.remove('show')});
  S=START();S.dif=dif;
  try{localStorage.removeItem('rumahmungil2')}catch(e){}
  S.ch.forEach((c,i)=>place(i,c.x,c.y,0));
  $('#pet').style.left='30%';$('#pet').style.top='66%';
  setView(0);pick(0);if($('#shop').classList.contains('open'))shop();render();sfx('up')};
S.ch.forEach((c,i)=>place(i,c.x,c.y,0));
S.nb.rel=S.nb.rel.slice(0,3);S.nb.v=S.nb.v.filter(x=>x.i<3);S.ch.forEach(c=>{if(c.rm<0)c.rm=0});skinChar(0);skinChar(1);setView(0);pick(0);setInterval(tick,100);
</script>
