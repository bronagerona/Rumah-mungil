name: Build Rumah Mungil Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - gemma-llama-android
    paths:
      - "android-app/**"
      - "index.html"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Generate React Native Android project
        run: npx --yes @react-native-community/cli@20 init RumahMungilNative --version 0.87.1 --skip-install
      - name: Install app dependencies
        working-directory: RumahMungilNative
        run: npm install && npm install llama.rn@0.13.0-rc.7 @react-native-documents/picker@12.0.3 react-native-webview@13.16.1
      - name: Copy game and app source
        run: |
          cp android-app/App.js RumahMungilNative/App.tsx
          mkdir -p RumahMungilNative/android/app/src/main/assets
          cp index.html RumahMungilNative/android/app/src/main/assets/index.html
      - name: Bundle React Native JavaScript for standalone APK
        working-directory: RumahMungilNative
        run: |
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Build debug APK
        working-directory: RumahMungilNative/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumah-mungil-debug-apk
          path: RumahMungilNative/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
