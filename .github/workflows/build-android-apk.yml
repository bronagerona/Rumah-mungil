name: Build Rumah Mungil Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - gemma-llama-android
    paths:
      - "android-app/**"
      - "index.html"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        working-directory: android-app
        run: npm install
      - name: Copy game HTML into Android assets
        run: |
          mkdir -p android-app/android/app/src/main/assets
          cp index.html android-app/android/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumah-mungil-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
